[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "signalsweep"
version = "0.3.0"
description = "SignalSweep: an autonomous data quality agent for the All Things Agentic Hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.7.1,<3",
  "google-genai>=2.12.1,<3",
  "google-cloud-firestore>=2.21.0",
  "pandas>=2.2.0",
  "streamlit>=1.48.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
signalsweep = "signalsweep.cli:main"
signalsweep-server = "signalsweep.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
